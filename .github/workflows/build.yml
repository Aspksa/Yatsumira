name: YATSUMIRA checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:static
      - run: node scripts/test-core.mjs
      - run: node scripts/test-memory.mjs
      - run: node scripts/test-memory-v3.mjs
      - run: node scripts/test-universal-memory.mjs
      - run: node scripts/test-memory-v5.mjs
      - run: node scripts/test-memory-v6.mjs
      - run: node scripts/test-memory-v7.mjs
      - run: node scripts/test-maintenance.mjs
      - run: node scripts/test-cloud.mjs
      - run: node scripts/test-knowledge.mjs
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload reference comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yatsumira-nexus-visual-snapshots
          path: |
            artifacts/visual/*.png
            artifacts/visual/reference-comparison.json
          if-no-files-found: warn
          retention-days: 14

  windows-clean-install:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: Yatsu & % ! ^ ( ) space
    steps:
      - uses: actions/checkout@v4
        with:
          path: Yatsu & % ! ^ ( ) space
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test clean npm install in special-character directory
        run: npm install --no-audit --no-fund
      - run: node --test scripts/test-project.mjs
      - run: node scripts/test-core.mjs
      - run: node scripts/test-memory.mjs
      - run: node scripts/test-memory-v3.mjs
      - run: node scripts/test-universal-memory.mjs
      - run: node scripts/test-memory-v5.mjs
      - run: node scripts/test-memory-v6.mjs
      - run: node scripts/test-memory-v7.mjs
      - run: node scripts/test-maintenance.mjs
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node node_modules/vite/bin/vite.js build
      - name: Test Windows preflight, UTF-8, file permissions, paths and report
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-preflight.ps1
      - name: Validate report
        run: |
          $report = Get-Content -LiteralPath .yatsumira/report.json -Raw | ConvertFrom-Json
          if (-not $report.success) { throw 'Windows preflight failed' }
          if (-not $report.checks) { throw 'Missing diagnostic checks' }
